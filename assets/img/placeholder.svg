  <text x="400" y="390" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="2">SLAF ADDITIVE MANUFACTURING</text>
  <text x="400" y="420" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Fabrication Artifact &amp; Engineering Visual</text>
